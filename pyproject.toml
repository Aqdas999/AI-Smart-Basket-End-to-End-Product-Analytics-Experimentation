[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-basket"
version = "1.0.0"
description = "Product analytics and A/B testing case study on the Olist marketplace dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_basket = ["dashboard_template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
